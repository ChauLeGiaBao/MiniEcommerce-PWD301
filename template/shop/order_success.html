<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Đặt hàng thành công</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 100px auto;
        }

        .success-box {
            background: white;
            padding: 45px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }

        .icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        h1 {
            color: #2e7d32;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        .order-id {
            margin: 25px 0;
            padding: 15px;
            background: #f1f8e9;
            border-radius: 8px;
            font-size: 18px;
        }

        .btn {
            display: inline-block;
            padding: 13px 25px;
            background: #1976d2;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 15px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="success-box">

        <div class="icon">
            ✅
        </div>

        <h1>
            Đặt hàng thành công!
        </h1>

        <p>
            Cảm ơn bạn đã mua hàng.
        </p>

        {% if order %}

        <div class="order-id">

            Mã đơn hàng:

            <strong>
                #{{ order.id }}
            </strong>

        </div>

        {% endif %}

        <a
            href="{{ url_for('shop.product_list') }}"
            class="btn"
        >
            Tiếp tục mua hàng
        </a>

    </div>

</div>

</body>

</html>
